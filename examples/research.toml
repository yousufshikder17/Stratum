# A complete, runnable Stratum research environment (spec §8 MVP item 1).
#
#   stratum ingest   --config examples/research.toml --backfill
#   stratum store    --config examples/research.toml
#   stratum universe --config examples/research.toml --universe sp1500_pit --as-of 2024-02-01
#   stratum snapshot --config examples/research.toml --as-of 2024-03-01T00:00:00Z
#
# The data under examples/data/ is synthetic and deliberately shaped to
# exercise the bias controls rather than to look realistic:
#
#   * ZZZ goes bankrupt mid-window. It is in the index until 2024-02-16 and
#     must still appear in a 2024-02-01 universe — dropping it is exactly the
#     survivorship error the store exists to prevent.
#   * BBB joins the index on 2024-02-01, announced 2024-01-25. Between those
#     dates the change is knowable but not yet effective; the two axes differ.
#   * AAA splits 2-for-1 on 2024-02-05, announced 2024-01-22.
#   * The ZZZ ticker is reused by an unrelated issuer in September 2024, so
#     resolving it without an as_of would attribute a dead company's history
#     to a living one.
#
# Paths are relative to this file, so the whole directory is movable.

[run]
id = "example-backfill"
seed = 0

[store]
path = "data/stratum.duckdb"

[resolver]
tables = "data/entities.csv"
version = "example-v0"
# Take any match. Raise this to keep low-confidence cashtag matches out.
floor = 0.0

[backfill]
start = "2024-01-01"
end = "2024-03-01"

[[adapters]]
id = "market_csv"
entity_kind = "ticker"

  [adapters.config]
  bars_path = "data/bars.csv"
  corporate_actions_path = "data/corporate_actions.csv"
  delistings_path = "data/delistings.csv"
  # When each daily bar became actionable. Explicit, because "midnight on the
  # bar date" would let a strategy trade on a close it had not yet seen.
  session_close_utc = "21:00"
  data_class = "public_agg"

[[adapters]]
id = "universe_csv"
entity_kind = "ticker"

  [adapters.config]
  membership_path = "data/membership.csv"
  universe_id = "sp1500_pit"
