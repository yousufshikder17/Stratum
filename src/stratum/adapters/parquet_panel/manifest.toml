# Adapter manifest (spec §3.1)
[adapter]
id             = "parquet_panel"
family         = "output"
version        = "0.1.0"
schema_version = "1"
isolation      = "inprocess"
config_schema  = "config.schema.json"
license_tag    = "n/a"
frequency      = "n/a"

[pit]
knowledge_time_basis = "ingestion"   # outputs ingest nothing
supports_restatement = false
publication_lag_p50_s = 0
