# Adapter manifest (spec §3.1)
[adapter]
id             = "cost_default"
family         = "cost_model"
version        = "0.1.0"
schema_version = "1"
isolation      = "inprocess"
config_schema  = "config.schema.json"
license_tag    = "n/a"
frequency      = "n/a"

[pit]
knowledge_time_basis = "ingestion"   # cost models ingest nothing
supports_restatement = false
publication_lag_p50_s = 0
